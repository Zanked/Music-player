name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip
        run: |
          unzip -o ./*.zip
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build jar
        run: gradle build --stacktrace
        working-directory: vinyldeck

      - uses: actions/upload-artifact@v4
        with:
          name: vinyldeck-jar
          path: vinyldeck/build/libs/*.jar
